name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.14'

      - name: Cache cabal packages
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('qhask.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-

      - name: Install dependencies
        run: cabal update && cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Test
        run: cabal test
